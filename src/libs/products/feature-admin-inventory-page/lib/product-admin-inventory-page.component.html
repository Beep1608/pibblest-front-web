<div class="bg-base-100 rounded-2xl shadow-sm border border-base-200/50 p-4 md:p-6 mb-6">
  
  <!-- Header Responsivo -->
  <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 w-full">
    
    <!-- Buscador Ocupa todo el ancho en mobile -->
    <label class="input w-full lg:w-1/2 outline-0 flex items-center gap-2 border-base-300">
      <i class="fa-solid fa-magnifying-glass text-base-content/50"></i>
      <input class="grow" #searchInput (keyup.enter)="searchAsAdmin(searchInput.value)" type="search" [placeholder]="'admin.inventory.search.placeholder' | translate" />
      <kbd class="kbd kbd-sm hidden sm:inline-flex">Enter</kbd>
    </label>

    <!-- Controles de Acciones y Vistas (Siempre visibles) -->
    <div class="flex w-full lg:w-auto justify-between lg:justify-end items-center gap-2">
      
      <!-- Controles de Vista (Cards/Tabla) -->
      <div class="join bg-base-200 p-1 rounded-lg">
        <button class="join-item btn btn-sm border-none shadow-none" 
                [class.btn-active]="product.displayMode() === 'grid'" 
                (click)="product.setDisplayMode('grid')">
          <i class="fa-solid fa-border-all"></i>
        </button>
        <button class="join-item btn btn-sm border-none shadow-none" 
                [class.btn-active]="product.displayMode() === 'table'" 
                (click)="product.setDisplayMode('table')">
          <i class="fa-solid fa-table-list"></i>
        </button>
      </div>
      
      <!-- Botones de Acción -->
      <div class="flex gap-2">
        <button class="btn btn-neutral lg:hidden" (click)="searchAsAdmin(searchInput.value)">
          <i class="fa-solid fa-search"></i>
        </button>
        <button class="btn btn-primary" (click)="navigateToCreate()">
          <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline-block ml-1">{{ 'admin.inventory.actions.new' | translate }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Botones de Tags (Debajo del Header) -->
  <div class="mt-4 pt-4 border-t border-base-200 w-full overflow-x-auto pb-2 scrollbar-hide">
    <app-tags-buttons-component (selectionChange)="product.setActiveTags($event)"></app-tags-buttons-component>
  </div>

    @if (product.displayMode() === 'grid') {
        <div class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-4 md:gap-6 w-full">
            @for (productItem of product.filteredProducts(); track productItem.id) {
                <app-product-preview-component [product]="productItem" [viewMode]="'admin'"></app-product-preview-component>
            } @empty {
                <div class="col-span-full flex flex-col items-center justify-center p-12 text-base-content/50">
                    <i class="fa-solid fa-box-open text-6xl mb-4"></i>
                    <p class="text-xl">{{ 'admin.inventory.empty' | translate }}</p>
                </div>
            }
        </div>
    } @else {
        <app-product-table-component [products]="product.filteredProducts()" [viewMode]="'admin'"></app-product-table-component>
    }

    @if (product.productsPage()) {
        <div class="flex justify-center mt-8">
            <div class="join">
                <button class="join-item btn" (click)="changePage(-1)" [disabled]="product.productsPage()?.pageNo === 0 || product.isLoading()">
                    <i class="fa-solid fa-chevron-left mr-1"></i>
                    {{ 'inventory.pagination.prev' | translate }}
                </button>
                <button class="join-item btn pointer-events-none">
                    {{ 'inventory.pagination.page' | translate }} {{ (product.productsPage()?.pageNo ?? 0) + 1 }} {{ 'inventory.pagination.of' | translate }} {{ product.productsPage()?.totalPages || 1 }}
                </button>
                <button class="join-item btn" (click)="changePage(1)" [disabled]="product.productsPage()?.last || product.isLoading()">
                    {{ 'inventory.pagination.next' | translate }}
                    <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    }

</div>
