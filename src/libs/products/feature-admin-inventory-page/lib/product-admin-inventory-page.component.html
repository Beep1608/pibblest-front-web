<!-- src/libs/products/feature-admin-inventory-page/lib/product-admin-inventory-page.component.html -->
<div class="bg-base-100 rounded-2xl shadow-sm border border-base-200/50 p-6" id="adminMenuList">
	<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 w-full">
		<label class="input w-full outline-0 flex items-center gap-2">
			<i class="fa-solid fa-magnifying-glass text-base-content/50"></i>
			<input class="grow" #searchInput (keyup.enter)="searchAsAdmin(searchInput.value)" type="search" [placeholder]="'admin.inventory.search.placeholder' | translate" />
			<kbd class="kbd kbd-sm">Enter</kbd>
		</label>
		<button class="btn btn-neutral" (click)="searchAsAdmin(searchInput.value)">
			<i class="fa-solid fa-search"></i>
			{{ 'admin.inventory.search.button' | translate }}
		</button>
	</div>

	<div class="p-1.5 rounded-full flex overflow-x-auto gap-1 mb-8 hide-scrollbar">
		<app-tags-buttons-component (selectionChange)="product.setActiveTags($event)"></app-tags-buttons-component>
	</div>

	<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
		@for (productItem of product.filteredProducts(); track productItem.id) {
			<app-product-preview-component [product]="productItem"></app-product-preview-component>
		} @empty {
			<div class="col-span-full flex flex-col items-center justify-center p-12 text-base-content/50">
				<i class="fa-solid fa-box-open text-6xl mb-4"></i>
				<p class="text-xl">{{ 'admin.inventory.empty' | translate }}</p>
			</div>
		}
	</div>
</div>
