<div class="card bg-base-100 shadow-sm border border-base-200/50 max-w-4xl mx-auto mt-6">
	<div class="card-body">
		<h2 class="card-title text-2xl font-bold mb-6">
			<i class="fa-solid fa-box-open mr-2"></i>
			{{ 'admin.product.create.title' | translate }}
		</h2>
		
		@if (product.isSuccess() && product.message()) {
			<div class="alert alert-success mb-6">
				<i class="fa-solid fa-circle-check"></i>
				<span>{{ product.message() }}</span>
			</div>
		}

		@if (product.error()) {
			<div class="alert alert-error mb-6">
				<i class="fa-solid fa-circle-exclamation"></i>
				<span>{{ product.error() }}</span>
			</div>
		}

		<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
			
			<label class="form-control w-full">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.name' | translate }}</span></div>
				<input type="text" formControlName="name" class="input input-bordered w-full" 
					   [class.input-error]="productForm.controls.name.invalid && productForm.controls.name.touched" />
			</label>

			<label class="form-control w-full">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.brand' | translate }}</span></div>
				<input type="text" formControlName="brand" class="input input-bordered w-full" 
					   [class.input-error]="productForm.controls.brand.invalid && productForm.controls.brand.touched" />
			</label>

			<label class="form-control w-full">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.sku' | translate }}</span></div>
				<input type="text" formControlName="sku" class="input input-bordered w-full" 
					   [class.input-error]="productForm.controls.sku.invalid && productForm.controls.sku.touched" />
			</label>

			<label class="form-control w-full">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.barcode' | translate }}</span></div>
				<input type="text" formControlName="barcode" class="input input-bordered w-full" 
					   [class.input-error]="productForm.controls.barcode.invalid && productForm.controls.barcode.touched" />
			</label>

			<label class="form-control w-full">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.basePrice' | translate }}</span></div>
				<label class="input input-bordered flex items-center gap-2" [class.input-error]="productForm.controls.basePrice.invalid && productForm.controls.basePrice.touched">
					<i class="fa-solid fa-dollar-sign text-base-content/50"></i>
					<input type="number" formControlName="basePrice" class="grow" />
				</label>
			</label>

			<label class="form-control w-full">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.cost' | translate }}</span></div>
				<label class="input input-bordered flex items-center gap-2" [class.input-error]="productForm.controls.cost.invalid && productForm.controls.cost.touched">
					<i class="fa-solid fa-dollar-sign text-base-content/50"></i>
					<input type="number" formControlName="cost" class="grow" />
				</label>
			</label>

			<label class="form-control w-full md:col-span-2">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.quantity' | translate }}</span></div>
				<input type="number" formControlName="quantity" class="input input-bordered w-full" 
					   [class.input-error]="productForm.controls.quantity.invalid && productForm.controls.quantity.touched" />
			</label>

			<label class="form-control w-full md:col-span-2">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.description' | translate }}</span></div>
				<textarea formControlName="description" class="textarea textarea-bordered h-24 w-full" 
						  [class.textarea-error]="productForm.controls.description.invalid && productForm.controls.description.touched"></textarea>
			</label>

			<label class="form-control w-full md:col-span-2">
				<div class="label"><span class="label-text">{{ 'admin.product.fields.tags' | translate }}</span></div>
				@if (tagStore.isLoading()) {
					<div class="flex items-center justify-center p-4 border border-base-200 rounded-box bg-base-100/50">
						<span class="loading loading-spinner text-primary"></span>
					</div>
				} @else {
					<select multiple class="select select-bordered w-full h-32 p-2" (change)="onTagsChange($event)">
						@for (tag of tagStore.productTags(); track tag.id) {
							<option class="p-2 mb-1 rounded-md hover:bg-base-200" [value]="tag.id">
								{{ tag.name }}
							</option>
						}
					</select>
					<div class="label"><span class="label-text-alt text-base-content/60">{{ 'admin.product.fields.tags.hint' | translate }}</span></div>
				}
			</label>

			<div class="md:col-span-2 flex justify-end gap-3 mt-4">
				<button type="button" class="btn btn-ghost" (click)="goBack()">
					<i class="fa-solid fa-arrow-left mr-1"></i>
					{{ 'admin.product.create.cancel' | translate }}
				</button>
				<button type="submit" class="btn btn-primary" [disabled]="product.isSubmitting()">
					@if (product.isSubmitting()) {
						<span class="loading loading-spinner"></span>
					} @else {
						<i class="fa-solid fa-save mr-1"></i>
						{{ 'admin.product.create.submit' | translate }}
					}
				</button>
			</div>
		</form>
	</div>
</div>
