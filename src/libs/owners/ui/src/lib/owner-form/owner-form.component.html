<div class="flex min-h-screen">
  <div class="hidden lg:flex lg:w-1/2 bg-gray-100 items-center justify-center p-12">  </div>
  <form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-4 max-w-md mx-auto p-6 bg-white shadow-md rounded-lg"
>
  <h2 class="text-2xl font-bold mb-4">Registrar Nuevo Dueño</h2>

  <div class="flex flex-col">
    <label for="" class="text-sm font-semibold mb-1"> Apellidos</label>
    <input
      type="email"
      formControlName="email"
      class="border rounded p-2"
      placeholder="juanito@algo.com"
    />
    @if (form.controls.email.hasError('email') && form.controls.email.touched) {
      <span class="text-red-500 text-xs mt-1"> Ingresa un correo válido</span>
    }
  </div>

  <div class="flex flex-col">
    <label for="" class="text-sm font-semibold mb-1"> Nombre del negocio</label>
    <input type="text" 
    formControlName="name"
    class="border rounded p-2"
    placeholder="Abarrotes pibble">
  </div>

  <button
    type="submit"
    [disabled]="form.invalid || isLoadig"
    class="mt-4 bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 disabled:bg-gray-400 transition colors">
    @if (isLoadig()) {

    } @else {
        
    }

  </button>


</form>
</div>
