<div class="grid grid-cols-[max-content_max-content_max-content] gap-4">
       <div class="card card-lg card-dash  flex items-center justify-center w-96 bg-transparent  h-64 hover:bg-gray-300">
        <i class="fa-solid fa-plus text-4xl"></i>
        <label for="" class="label">Crea una nueva tienda!</label>
       </div>

  @for (store of stores(); track $index) {
    <div class="card card-lg w-96 h-64 bg-gray-100 shadow-sm">
        <div class="badge badge-outline badge-primary  mx-2 my-2">{{store.createdAt}}</div>
      <div class="card-body">
        <div class="flex flex-col items-center">
          <i class="fa-solid fa-shop text-2xl"></i>
          <h2 class="card-title">{{ store.name }}</h2>
        </div>
      </div>
      <div class="card-actions">
        <div class="flex w-full gap-3 items-center justify-center">
            <div class="badge badge-outline badge-success">
                <i class="fa-solid fa-arrow-up"></i>
                {{store.growthFromStart}} % 
            </div>
            <div class="badge badge-outline badge-info">
                <i class="fa-solid fa-user-tie"></i>
                {{store.employees}}</div>
            <div class="badge badge-outline badge-success">
                <i class="fa-solid fa-dollar-sign"></i>
                {{store.salesOfToday}}</div>
        </div>

        <div class="flex w-full justify-center items-center gap-2 py-2">
            <progress class="progress w-56" value="50" max="100"></progress>
            <div class="badge badge-outline badge-warning">
                <i class="fa-solid fa-cubes"></i>
                {{store.currentQuantityOfProducts}} / {{store.totalProducts}}
            </div>
        </div>
        
      </div>
    </div>
  }
</div>
