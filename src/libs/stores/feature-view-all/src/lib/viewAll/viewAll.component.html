<div class="grid grid-cols-[max-content_max-content_max-content] gap-4">
  <div
    class="card card-lg card-dash flex items-center justify-center w-96 bg-transparent h-64 hover:bg-gray-300"
  >
    <i class="fa-solid fa-plus text-4xl"></i>
    <label for="" class="label">Crea una nueva tienda!</label>
  </div>

  @if (store.storesPage(); as page) {
    @for (store of page.stores; track $index) {
      <app-store-preview-component [storePreview]="store"></app-store-preview-component>
    }
  }
</div>
