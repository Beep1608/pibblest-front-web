<div class="bg-base-200/30 min-h-screen p-4">
  <div>
   <button class="btn text-center" (click)="store.setView('view-all')"><i class="fa-solid fa-arrow-left"></i></button>
  </div>
  <div role="tablist" class="tabs tabs-border mb-6">
    <a role="tab" class="tab" [class.tab-active]="store.selectedSubMenu() === 'sale'" (click)="store.setSubmenu('sale')">
      {{ 'stores.sale' | translate }}
    </a>
    <a role="tab" class="tab font-medium" [class.tab-active]="store.selectedSubMenu() === 'products'" (click)="store.setSubmenu('products')">
      {{ 'stores.products' | translate }}
    </a>
    <a role="tab" class="tab" [class.tab-active]="store.selectedSubMenu() === 'sale-history'" (click)="store.setSubmenu('sale-history')">
      miau
    </a>
  </div>

  @if (store.selectedSubMenu() === 'products' || store.selectedSubMenu() === 'sale') {
    <app-store-invetory-component ></app-store-invetory-component>
  }
  
</div>
