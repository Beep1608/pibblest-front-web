<div
  class="flex border-2 border-gray-100 bg-transparent w-80 rounded-md hover:shadow-md hover:cursor-pointer"
  (click)="dashBoardStore.setView('store-page')"
>
  <div class="grow">
    <div class="my-2">
      <span
        class="text-xs text-amber-400 font-bold bg-amber-100 mx-2 px-3 py-1 rounded-md border box-border border-amber-400"
        >{{ storePreview().operatinTime }}</span
      >
    </div>
    <div
      class="flex flex-col gap-3 items-center justify-center col-start-1 row-start-2 row-end-3"
    >
      <i class="fa-solid fa-shop text-5xl"></i>
      <span>{{ storePreview().name }}</span>
    </div>

    <div class="col-start-1 flex flex-col gap-2 py-2">
      <div class="flex items-center justify-center gap-4 mx-2">
        <div
          class="flex items-center gap-3 px-2 py-1 border border-green-600 rounded-md bg-green-100"
        >
          <i
            class="fa-solid fa-arrow-up text-sm self-baseline text-green-600"
          ></i>
          <span class="text-xs text-green-600 font-bold box-border">{{
            storePreview().growthFromStart
          }}</span>
        </div>

        <div
          class="flex items-center gap-3 px-2 py-1 border border-slate-600 rounded-md bg-slate-100"
        >
          <i
            class="fa-solid fa-user-tie text-sm self-baseline text-slate-600"
          ></i>
          <span class="text-xs text-slate-600 font-bold box-border">{{
            storePreview().employees
          }}</span>
        </div>

        <div
          class="flex items-center gap-2 px-2 py-1 border border-green-600 rounded-md bg-green-100"
        >
          <i
            class="fa-solid fa-dollar-sign text-sm self-baseline text-green-600"
          ></i>
          <span
            #salesSpan
            class="text-xs text-green-600 font-bold box-border inline-block"
          >
            {{ storePreview().salesOfToday }}
          </span>
        </div>
      </div>

      <div class="mx-2 flex flex-col">
        <div class="flex justify-end">
          <span class="label">{{ percentageOfProducts() }} %</span>
        </div>
        <div class="w-full bg-blue-100 h-4 rounded-md overflow-hidden">
          <div
            class="bg-blue-600 h-full transition-all duration-500 ease-in-out rounded-md"
            [style.width.%]="percentageOfProducts()"
          ></div>
        </div>
        <div>
          <span class="label"
            >{{ storePreview().currentQuantityOfProducts }}/</span
          >

          <span class="label">{{ storePreview().totalProducts }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
