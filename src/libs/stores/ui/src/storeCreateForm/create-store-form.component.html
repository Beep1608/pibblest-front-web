<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 mt-6">
  
  <div class="flex items-center gap-4 mb-6 pb-4 border-b border-gray-100">
    <button (click)="dashbordStore.setView('store')" class="text-gray-500 hover:text-gray-800 transition">
      <i class="fa-solid fa-arrow-left text-lg"></i>
    </button>
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Crear Nueva Tienda</h1>
      <p class="text-xs text-gray-400">Ingresa los parámetros iniciales para el punto de venta</p>
    </div>
  </div>

  <form [formGroup]="storeForm" (ngSubmit)="onSubmit()" class="space-y-4">
    
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre de la Tienda *</label>
      <input 
        type="text" 
        formControlName="name" 
        placeholder="Ej. Sucursal Centro"
        class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:border-blue-500"
      />
      @if (storeForm.controls.name.touched && storeForm.controls.name.hasError('required')) {
        <span class="text-[10px] text-red-500 mt-1 block">El nombre es obligatorio</span>
      }
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1">Dirección *</label>
      <input 
        type="text" 
        formControlName="address" 
        placeholder="Calle Principal #123"
        class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:border-blue-500"
      />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Estado Operativo</label>
        <select 
          formControlName="status"
          class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm bg-white focus:outline-none focus:border-blue-500"
        >
          <option value="ACTIVE">Activa</option>
          <option value="MAINTENANCE">Mantenimiento</option>
          <option value="PRE_OPENING">Pre-apertura</option>
        </select>
      </div>




    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
      <button 
        type="button" 
        (click)="dashbordStore.setView('store')" 
        class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-md transition"
      >
        Cancelar
      </button>
      
      <button 
        type="submit" 
        [disabled]="storeForm.invalid"
        class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-md transition"
      >
        Guardar Tienda
      </button>
    </div>

  </form>
</div>
