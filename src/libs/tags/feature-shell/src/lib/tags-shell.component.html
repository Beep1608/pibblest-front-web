<div class="w-full h-full">
  @switch (tagStore.currentView()) {
    @case ('list') {
      <app-tags-list-page></app-tags-list-page>
    }
    @case ('create') {
      <app-tags-form-page></app-tags-form-page>
    }
    @case ('edit') {
      <app-tags-form-page></app-tags-form-page>
    }
    @default {
      <app-tags-list-page></app-tags-list-page>
    }
  }
</div>
