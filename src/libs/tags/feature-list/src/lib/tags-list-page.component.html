<!-- src/libs/tags/feature-list/src/lib/tags-list-page.component.html -->
<div class="bg-base-100 rounded-2xl shadow-sm border border-base-200/50 p-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 w-full">
    
    <label class="input w-full md:w-1/2 outline-0 flex items-center gap-2 border-base-300">
      <i class="fa-solid fa-magnifying-glass text-base-content/50"></i>
      <input class="grow" #searchInput (keyup.enter)="onSearch(searchInput.value)" type="search" [placeholder]="'tags.search.placeholder' | translate" [value]="tagStore.currentKeyword()" />
      <kbd class="kbd kbd-sm">Enter</kbd>
    </label>

    <div class="flex w-full md:w-auto gap-2">
      <button class="btn btn-neutral w-full md:w-auto" (click)="onSearch(searchInput.value)">
        <i class="fa-solid fa-search"></i> {{ 'admin.inventory.search.button' | translate }}
      </button>

      <button class="btn btn-primary" (click)="navigateToCreate()">
        <i class="fa-solid fa-plus"></i> {{ 'tags.actions.new' | translate }}
      </button>
    </div>
  </div>

  @if (tagStore.isLoading()) {
    <div class="flex justify-center p-12">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  } @else {
    @if (tagStore.tagsPage(); as page) {
      <app-tag-table [tags]="page.tags"></app-tag-table>
      
      <div class="flex justify-center mt-8">
        <div class="join">
          <button class="join-item btn" (click)="changePage(-1)" [disabled]="page.pageNo === 0 || tagStore.isLoading()">
            <i class="fa-solid fa-chevron-left mr-1"></i>
            {{ 'stores.pagination.prev' | translate }}
          </button>
          <button class="join-item btn pointer-events-none">
            {{ 'stores.pagination.page' | translate }} {{ page.pageNo + 1 }} {{ 'stores.pagination.of' | translate }} {{ page.totalPages || 1 }}
          </button>
          <button class="join-item btn" (click)="changePage(1)" [disabled]="page.last || tagStore.isLoading()">
            {{ 'stores.pagination.next' | translate }}
            <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    }
  }
</div>
