<!-- src/libs/tags/feature-form/src/lib/tags-form-page.component.html -->
<div class="container mx-auto p-4 max-w-lg">
  <div class="flex items-center gap-4 mb-6">
    <button class="btn btn-ghost btn-circle" (click)="goBack()">
      <i class="fa-solid fa-arrow-left text-lg"></i>
    </button>
    <h1 class="text-2xl font-bold">
      {{ (tagStore.currentView() === 'edit' ? 'tags.edit.title' : 'tags.create.title') | translate }}
    </h1>
  </div>

  @if (tagStore.isSuccess() && tagStore.message()) {
    <div class="alert alert-success mb-4"><i class="fa-solid fa-circle-check"></i><span>{{ tagStore.message() }}</span></div>
  }
  @if (tagStore.error()) {
    <div class="alert alert-error mb-4"><i class="fa-solid fa-circle-exclamation"></i><span>{{ tagStore.error() }}</span></div>
  }

  <div class="card bg-base-100 shadow-xl border border-base-200">
    <div class="card-body p-0 sm:p-6">
      <app-tag-form 
        [initialData]="tagStore.selectedTag()"
        [isSubmitting]="tagStore.isSubmitting()"
        (submitForm)="onSave($event)"
        (cancel)="goBack()">
      </app-tag-form>
    </div>
  </div>
</div>
