<!-- src/libs/tags/ui/src/lib/tag-form/tag-form.component.html -->
<div class="card bg-base-100 border border-base-200/60 shadow-sm mx-auto">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="card-body gap-5">
    
    <div class="form-control">
      <label class="label pb-1.5">
        <span class="label-text font-medium text-base-content/80">{{ 'tags.form.nameLabel' | translate }}</span>
      </label>
      <div class="relative flex items-center">
        <i class="fa-solid fa-tag absolute left-4 text-base-content/40 text-sm z-10"></i>
        <input type="text" formControlName="name" [placeholder]="'tags.form.namePlaceholder' | translate"
          class="input input-bordered pl-10 w-full transition-all duration-200 focus:input-primary focus:outline-none" />
      </div>
    </div>

    <div class="card-actions justify-end gap-3 mt-4 pt-4 border-t border-base-200/60">
      <button type="button" class="btn btn-ghost hover:bg-base-200/50" (click)="cancel.emit()">
        {{ 'stores.form.cancel' | translate }}
      </button>
      <button type="submit" class="btn btn-primary px-6 shadow-sm" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <span class="loading loading-spinner"></span>
        } @else {
          {{ 'stores.form.submit' | translate }}
        }
      </button>
    </div>
  </form>
</div>
