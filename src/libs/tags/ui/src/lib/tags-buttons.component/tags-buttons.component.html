<!-- src/libs/tags/ui/src/lib/tags-buttons.component/tags-buttons.component.html -->
<div class="flex items-center gap-2">
  <input
    class="btn btn-sm rounded-full"
    [checked]="activeCategories().length === 0"
    (change)="selectAll()"
    type="checkbox"
    aria-label="{{ 'categoryList.All' | translate }}"
  />

  @for (tag of (tagStore.currentContext() === 'stores' ? tagStore.allStoreTagsList() : tagStore.allProductTagsList()); track tag.id) {
    <input
      class="btn btn-sm rounded-full"
      #checkbox
      [attr.aria-label]="tag.name"
      [checked]="activeCategories().includes(tag.id)"
      (change)="onTagToggle(tag.id, checkbox.checked)"
      type="checkbox"
    />
  }
</div>
