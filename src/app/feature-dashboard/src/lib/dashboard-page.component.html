<div class="drawer lg:drawer-open">
  <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">


    <!-- Navbar -->
    <nav class="navbar w-full ">
      <label
        for="my-drawer-4"
        aria-label="open sidebar"
        class=" btn-ghost"
      >
        <!-- Sidebar toggle icon -->
      <i class="fa-solid fa-caret-right transition-transform duration-300 caret-icon"></i>
      </label>
      
    </nav>


    <!-- Page content here -->
    <div class="p-4">
      <div>
        @switch (dashboardStore.currentView()) {
          @case ('store') {
            <app-store-view-all-page
              class="col-span-full"
            ></app-store-view-all-page>
          }
          @case ('create-store') {
            <app-store-create-page></app-store-create-page>
          }
          @case ('tags') {}
          @case ('store-page') {<app-store-page></app-store-page>}
        }
      </div>
    </div>
  </div>

  <div class="drawer-side is-drawer-close:overflow-visible">
    <label
      for="my-drawer-4"
      aria-label="close sidebar"
      class="drawer-overlay"
    ></label>
    <div
      class="flex min-h-full flex-col items-start bg-base-200 is-drawer-close:w-14 is-drawer-open:w-64"
    >
      <ul class="menu w-full grow">
        <!-- List item -->
        <li>
          <button
            class="is-drawer-close:tooltip is-drawer-close:tooltip-right"
            [attr.data-tip]="'dashboard.sidebar.overview' | translate"
          >
            <!-- Home icon -->
            <i class="fa-solid fa-house"></i>
            <span class="is-drawer-close:hidden">{{
              'dashboard.sidebar.overview' | translate
            }}</span>
          </button>
        </li>

        <!-- List item -->
        <li>
          <button
           
            class="is-drawer-close:tooltip is-drawer-close:tooltip-right"
            [attr.data-tip]="'dashboard.sidebar.stores' | translate"
          >
            <!-- Settings icon -->
            <i class="fa-solid fa-store"></i>
            <span class="is-drawer-close:hidden">{{
              'dashboard.sidebar.stores' | translate
            }}</span>
          </button>
        </li>

        <li>
          <button
            class="is-drawer-close:tooltip is-drawer-close:tooltip-right"
            [attr.data-tip]="'dashboard.sidebar.tags' | translate"
          >
            <!-- Settings icon -->
            <i class="fa-solid fa-tag"></i>
            <span class="is-drawer-close:hidden">{{
              'dashboard.sidebar.tags' | translate
            }}</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</div>
