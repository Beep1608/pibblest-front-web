<!-- Contenedor principal que ocupa toda la pantalla -->
<div class="flex h-screen bg-gray-100 font-sans">

  <!-- SIDEBAR (Barra lateral izquierda) -->
  <aside class="w-64 bg-gray-900 text-white flex flex-col">
    <div class="p-6 border-b border-gray-800">
      <h2 class="text-2xl font-bold tracking-wider text-blue-400">Pibble POS</h2>
    </div>
    
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <!-- Enlace activo (ejemplo) -->
      <a href="#" class="block py-2 px-4 bg-gray-800 text-blue-400 rounded transition-colors">
        📊 Panel Principal
      </a>
      <a href="#" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded transition-colors">
        📦 Productos
      </a>
      <a href="#" class="block py-2 px-4 text-gray-400 hover:bg-gray-800 hover:text-white rounded transition-colors">
        🛒 Ventas
      </a>
    </nav>

    <!-- Botón de Cerrar Sesión pegado abajo -->
    <div class="p-4 border-t border-gray-800">
      <button 
        (click)="onLogout()" 
        class="w-full flex justify-center items-center gap-2 bg-red-600 hover:bg-red-700 py-2 px-4 rounded text-white font-semibold transition-colors">
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL (Lado derecho) -->
  <main class="flex-1 flex flex-col overflow-hidden">
    
    <!-- HEADER (Cabecera blanca) -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
      <h1 class="text-2xl font-bold text-gray-800">Resumen de Hoy</h1>
      <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-600">Propietario</span>
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold border border-blue-200">
          P
        </div>
      </div>
    </header>

    <!-- ÁREA DE TARJETAS (Scrollable) -->
    <div class="p-6 flex-1 overflow-y-auto">
      
      <!-- Grid para las métricas -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
          <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-2">Ventas de Hoy</h3>
          <p class="text-3xl font-bold text-gray-800">$0.00</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
          <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-2">Productos</h3>
          <p class="text-3xl font-bold text-gray-800">0</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 border-l-4 border-l-purple-500">
          <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-2">Alertas de Stock</h3>
          <p class="text-3xl font-bold text-gray-800">0</p>
        </div>
        
      </div>

      <!-- Aquí podrías poner una tabla de últimas ventas en el futuro -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 h-64 flex items-center justify-center">
        <p class="text-gray-400">Aún no hay transacciones recientes.</p>
      </div>

    </div>
  </main>

</div>
